name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported and latest stable
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest

      - name: Verify standalone installation
        run: |
          uv build --out-dir "$RUNNER_TEMP/release-dist"
          uv venv "$RUNNER_TEMP/release-venv"
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" "$RUNNER_TEMP"/release-dist/*.whl
          "$RUNNER_TEMP/release-venv/bin/python" -I tests/packaging_smoke.py
